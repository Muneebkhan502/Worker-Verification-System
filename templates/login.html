<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Tove Leeds</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
    background: #f4f6f9;
    min-height: 100vh;
    display: flex;
    align-items: center;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .login-card {
    max-width: 380px;
    width: 100%;
    margin: 0 auto;
    border: none;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  }
  .logo-text { font-weight: 700; font-size: 22px; color: #0e3c73; text-align: center; }
  .logo-text small { display:block; font-size: 11px; letter-spacing: 1px; color: #6b7280; }
</style>
</head>
<body>

<div class="container">
  <div class="card login-card p-4">
    <div class="logo-text mb-4">TOVE LEEDS<small>CERTIFICATION &amp; INSPECTION</small></div>

    {% if error %}
    <div class="alert alert-danger py-2 small">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Username</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label small fw-semibold">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-dark w-100">Sign In</button>
    </form>
  </div>
</div>

</body>
</html>
